apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sre-lab
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'api'
        metrics_path: /metrics
        static_configs:
          - targets: ['api:3000']
            labels:
              service: api
              namespace: sre-lab